AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Jorge Solar Monitor

Parameters:
  # ── Solarman ──────────────────────────────────────────────────────────────
  SolarmanUserPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/solarman_user
  SolarmanPassPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/solarman_password
  SolarmanOrgIdPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/solarman_org_id
  TwoCaptchaApiKeyPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/two_captcha_api_key

  # ── Elekeeper (SAJ iop) ───────────────────────────────────────────────────
  ElekeeperUserPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/elekeeper_user
  ElekeeperPassPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/elekeeper_password

  # ── E-mail ────────────────────────────────────────────────────────────────
  SenderPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/sender_email
  RecipientsPath:
    Type: "AWS::SSM::Parameter::Value<String>"
    Default: /jorge/prod/recipients_emails

Globals:
  Function:
    Timeout: 300 # Turnstile (~90s) + logins + busca de plantas
    MemorySize: 256

Resources:
  JorgeSolarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Policies:
        - SESCrudPolicy:
            IdentityName: "*"
      Environment:
        Variables:
          SOLARMAN_USER: !Ref SolarmanUserPath
          SOLARMAN_PASS: !Ref SolarmanPassPath
          SOLARMAN_ORG_ID: !Ref SolarmanOrgIdPath
          TWO_CAPTCHA_API_KEY: !Ref TwoCaptchaApiKeyPath
          ELEKEEPER_USER: !Ref ElekeeperUserPath
          ELEKEEPER_PASS: !Ref ElekeeperPassPath
          SENDER_EMAIL: !Ref SenderPath
          RECIPIENTS_EMAILS: !Ref RecipientsPath
          TZ: "America/Sao_Paulo"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 * * ? *) # UTC 20h = BRT 17h
            Description: Executa diariamente às 17h BRT
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

Outputs:
  JorgeSolarFunctionArn:
    Value: !GetAtt JorgeSolarFunction.Arn
